<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Candle K</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="/static/css/admin.css">
  <style>
    body { background: var(--bg); }

    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Ambient glow */
    .login-wrap::before {
      content: '';
      position: fixed;
      top: -20%;
      right: -10%;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232,160,160,.06) 0%, transparent 65%);
      pointer-events: none;
    }
    .login-wrap::after {
      content: '';
      position: fixed;
      bottom: -15%;
      left: -8%;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(143,168,130,.04) 0%, transparent 65%);
      pointer-events: none;
    }

    .login-card {
      width: 100%;
      max-width: 390px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 44px 38px 40px;
      position: relative;
      z-index: 1;
      animation: cardIn .5s cubic-bezier(.4,0,.2,1);
    }

    @keyframes cardIn {
      from { opacity:0; transform:translateY(16px); }
      to   { opacity:1; transform:none; }
    }

    /* Logo */
    .login-logo-wrap {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-logo-wrap img {
      height: 76px;
      width: auto;
      object-fit: contain;
      filter: brightness(1.5) saturate(.35);
      opacity: .82;
      margin-bottom: 10px;
    }
    .login-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      color: var(--ivory);
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .login-sub {
      font-family: 'Dancing Script', cursive;
      font-size: .88rem;
      color: var(--pink);
      margin-top: 2px;
    }

    /* Divider */
    .login-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 4px 0 24px;
      color: var(--text-dim);
      font-size: .65rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Error / lockout states */
    .login-error {
      background: rgba(217,119,119,.1);
      border: 1px solid rgba(217,119,119,.25);
      color: #e9a0a0;
      padding: 12px 16px;
      border-radius: 4px;
      font-size: .84rem;
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .login-error-icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }

    .login-locked {
      background: rgba(212,160,85,.08);
      border: 1px solid rgba(212,160,85,.25);
      color: #c8a060;
      padding: 18px 16px;
      border-radius: 4px;
      font-size: .84rem;
      margin-bottom: 20px;
      text-align: center;
    }
    .login-locked-icon { font-size: 2rem; margin-bottom: 8px; }
    .login-locked strong { display: block; font-size: 1rem; margin-bottom: 4px; color: #d4a055; }

    /* Inputs */
    .login-field { margin-bottom: 16px; }
    .login-field label {
      display: block;
      font-size: .68rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 7px;
      font-weight: 500;
    }
    .login-field .input-wrap {
      position: relative;
    }
    .login-field .input-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      width: 15px; height: 15px;
      pointer-events: none;
    }
    .login-field input {
      width: 100%;
      padding: 11px 12px 11px 38px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--ivory);
      font-family: 'Jost', sans-serif;
      font-size: .88rem;
      border-radius: 4px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .login-field input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(232,160,160,.1);
    }
    .login-field input:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    /* Submit */
    .login-btn {
      width: 100%;
      padding: 13px;
      background: var(--pink);
      color: var(--bg);
      border: none;
      border-radius: 4px;
      font-family: 'Jost', sans-serif;
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .2s, transform .1s;
      margin-top: 22px;
    }
    .login-btn:hover:not(:disabled) { background: var(--pink-deep); }
    .login-btn:active:not(:disabled) { transform: scale(.98); }
    .login-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* Security badge */
    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      font-size: .71rem;
      color: var(--text-dim);
    }
    .security-badge svg { width: 12px; height: 12px; }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">

    <div class="login-logo-wrap">
      <img src="/static/images/logo.jpeg" alt="Candle K">
      <div class="login-brand">Candle K</div>
      <div class="login-sub">Admin Portal</div>
    </div>

    <div class="login-divider">Secure Access</div>

    <!-- Locked out state -->
    {% if locked %}
    <div class="login-locked">
      <div class="login-locked-icon">🔒</div>
      <strong>Account Temporarily Locked</strong>
      Too many failed attempts. Please wait <strong>15 minutes</strong> and try again.
    </div>
    {% elif error %}
    <div class="login-error">
      <span class="login-error-icon">⚠️</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" autocomplete="on">
      <div class="login-field">
        <label>Username</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" name="username" placeholder="Enter username"
                 autocomplete="username" required {% if locked %}disabled{% endif %}
                 autofocus>
        </div>
      </div>

      <div class="login-field">
        <label>Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
          <input type="password" name="password" placeholder="Enter password"
                 autocomplete="current-password" required {% if locked %}disabled{% endif %}>
        </div>
      </div>

      <button type="submit" class="login-btn" {% if locked %}disabled{% endif %}>
        {% if locked %}🔒 Locked{% else %}Sign In →{% endif %}
      </button>
    </form>

    <div class="security-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      Protected by rate limiting · 5 attempts max per 15 min
    </div>

  </div>
</div>
</body>
</html>
