{% extends "admin/base.html" %}
{% block title %}Change Password — Admin{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}
<div style="max-width:480px;">
  <div class="admin-card">
    <div class="admin-card__header"><div class="admin-card__title">Update Password</div></div>
    <div class="admin-card__body">
      {% if error %}
      <div class="admin-alert admin-alert-error" style="margin-bottom:20px;">{{ error }}</div>
      {% endif %}
      <form method="POST">
        <div class="admin-form-group">
          <label>Current Password</label>
          <input type="password" name="current_password" class="admin-input" required placeholder="Enter current password">
        </div>
        <div class="admin-form-group">
          <label>New Password</label>
          <input type="password" name="new_password" class="admin-input" required placeholder="Enter new password" minlength="6">
        </div>
        <div class="admin-form-group" style="margin-bottom:28px;">
          <label>Confirm New Password</label>
          <input type="password" name="confirm_password" class="admin-input" required placeholder="Repeat new password">
        </div>
        <button type="submit" class="admin-btn admin-btn-primary" style="width:100%; justify-content:center; padding:14px;">Update Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
